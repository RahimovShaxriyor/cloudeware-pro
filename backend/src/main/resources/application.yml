spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudware}
    username: ${SPRING_DATASOURCE_USERNAME:cloudware}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudware_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json

app:
  instance-id: ${APP_INSTANCE_ID:local-backend}

logging:
  level:
    root: INFO
    com.cloudware: INFO
    org.springframework.jdbc: WARN
