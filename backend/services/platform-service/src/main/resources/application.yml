spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudware}
    username: ${SPRING_DATASOURCE_USERNAME:cloudware}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudware_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

server:
  port: ${SERVER_PORT:8087}
  compression:
    enabled: true

cloudware:
  service: platform

app:
  instance-id: ${APP_INSTANCE_ID:platform-service}

logging:
  level:
    root: INFO
    com.cloudware: INFO
