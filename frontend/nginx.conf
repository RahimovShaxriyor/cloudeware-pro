server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Identity & Access microservice
    location ~ ^/api/(auth|users|roles)(/|$) {
        proxy_pass http://identity-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Product Catalog microservice
    location ~ ^/api/products(/|$) {
        proxy_pass http://catalog-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # CRM microservice
    location ~ ^/api/customers(/|$) {
        proxy_pass http://crm-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # WMS microservice
    location ~ ^/api/(warehouses|inventory)(/|$) {
        proxy_pass http://wms-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Order Fulfillment microservice
    location ~ ^/api/orders(/|$) {
        proxy_pass http://order-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Finance microservice
    location ~ ^/api/payments(/|$) {
        proxy_pass http://finance-service:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Platform & Analytics microservice
    location ~ ^/api/(dashboard|reports|settings|activity|notifications|network|health|openapi)(/|$) {
        proxy_pass http://platform-service:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
